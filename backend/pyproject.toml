[project]
name = "ares-api"
version = "0.1.0"
description = "ARES security API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "qdrant-client>=1.11.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "rapidfuzz>=3.9.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: mark test as requiring live external API credentials",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
# FastAPI declares dependencies through function defaults; datetime.UTC needs Python 3.11+ semantics.
ignore = ["B008", "UP017"]

[tool.coverage.run]
source = ["app", "ares"]
omit = [
    "ares/training/export_gguf.py",
    "ares/training/export_ollama.py",
    "ares/intent/scale_dataset.py",
    "ares/intent/generate_targets.py",
    "ares/intent/build_dataset.py",
    "ares/intent/build_sft_dataset.py",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ares"]
