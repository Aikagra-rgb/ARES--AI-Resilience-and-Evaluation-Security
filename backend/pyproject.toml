[project]
name = "ares-api"
version = "0.1.0"
description = "ARES security API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "cryptography>=43,<46",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "qdrant-client>=1.11.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# FastAPI declares dependencies through function defaults; datetime.UTC needs Python 3.11+ semantics.
ignore = ["B008", "UP017"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ares"]
