name: ARES Nightly Red-Team Target Suite

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  redteam-targets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ares_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      ARES_AUTH_ENABLED: "false"
      ALLOW_DEV_IDENTITY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ares_test
      ARES_TARGET_MOCK_LLM: "1"
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build reference per-client ML models
        run: python -m ares.training.client_model_trainer --org=all

      - name: Run automated red-team target suite
        run: pytest tests/test_redteam_against_targets.py -v

      - name: Upload red-team findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-findings
          path: backend/data/redteam_findings.json
          if-no-files-found: warn
