name: ARES CI

on:
  push:
    branches: [ main, newBranch ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ares_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install canonical locked dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Compilation & Syntax Gate
        working-directory: backend
        run: |
          python -m compileall -q ares app scripts
          ruff check ares app scripts tests

      - name: Build reference per-client ML models
        working-directory: backend
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m ares.training.client_model_trainer --org=all

      - name: Run pytest unit test suite with coverage gate
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ares_test"
          GROQ_API_KEY: "mock-groq-key"
          GEMINI_API_KEY: "mock-gemini-key"
          NVIDIA_API_KEY: "mock-nvidia-key"
          QDRANT_URL: ":memory:"
          QDRANT_HOST: ":memory:"
          ARES_API_KEY: "ares-dev-secret-key-42"
          ENVIRONMENT: "test"
        run: |
          set -o pipefail
          pytest -m "not integration" -v --durations=10 --tb=short \
            --cov=ares --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50 \
            | tee test_run.log || {
              grep -E "^(FAILED|ERROR) " test_run.log | while IFS= read -r line; do
                echo "::error title=Pytest Failure::$line"
              done
              exit 1
            }

      - name: Upload pytest & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts-py${{ matrix.python-version }}
          path: |
            backend/test_run.log
            backend/coverage.xml

  frontend-tests:
    name: Frontend Build & Tests (.NET 8.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Ares.sln

      - name: Build solution
        run: dotnet build Ares.sln --no-restore --configuration Release

      - name: Run .NET test suite
        run: dotnet test Ares.sln --no-build --configuration Release --verbosity normal

  integration-contract-smoke:
    name: Integration, Live Contract & Benchmark Gate
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ares_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install backend locked dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Run migrations and train reference models
        working-directory: backend
        env:
          ENVIRONMENT: "staging"
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ares_test"
          ARES_AUTH_ENABLED: "true"
          ALLOW_DEV_IDENTITY: "false"
          ARES_API_KEY: "ci-master-secret-key-24-chars-min"
          HMAC_SECRET: "ci-hmac-signing-secret-24-chars-min"
          HMAC_ENFORCE_MODE: "enforcing_critical"
          PROMPT_FINGERPRINT_SECRET: "ci-fp-secret-24-chars-min"
          EXECUTION_PAYLOAD_ENCRYPTION_KEY: "Jz7cmIiWycPoeJ4u0Vcg5n_lDrU9pCqQR81hP25wUco="
          GATEWAY_CANARY_TOKEN: "CANARY_CI_SMOKE_TOKEN"
        run: |
          alembic upgrade head
          python -m ares.training.client_model_trainer --org=all

      - name: Start ARES API, run smoke + C# contract + Redis tests, and generate benchmark
        env:
          ENVIRONMENT: "staging"
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ares_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          QDRANT_URL: ":memory:"
          ARES_AUTH_ENABLED: "true"
          ALLOW_DEV_IDENTITY: "false"
          ARES_API_KEY: "ci-master-secret-key-24-chars-min"
          HMAC_SECRET: "ci-hmac-signing-secret-24-chars-min"
          HMAC_ENFORCE_MODE: "enforcing_critical"
          GATEWAY_FAIL_CLOSED_ON_OUTAGE: "false"
          PROMPT_FINGERPRINT_SECRET: "ci-fp-secret-24-chars-min"
          EXECUTION_PAYLOAD_ENCRYPTION_KEY: "Jz7cmIiWycPoeJ4u0Vcg5n_lDrU9pCqQR81hP25wUco="
          GATEWAY_CANARY_TOKEN: "CANARY_CI_SMOKE_TOKEN"
          ARES_TENANT_API_KEYS: "org_acme_fintech:ares_tnt_org_acme_fintech_ci_smoke_key"
          ARES_SMOKE_ACME_KEY: "ares_tnt_org_acme_fintech_ci_smoke_key"
          ARES_LIVE_BACKEND_URL: "http://127.0.0.1:8000"
          ARES_REQUIRE_LIVE_CONTRACT: "1"
          ARES_LIVE_REDIS_CONNECTION: "127.0.0.1:6379"
          ARES_REQUIRE_LIVE_REDIS: "1"
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn_ci.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health

          python scripts/ci_live_smoke_test.py
          cd ..
          dotnet test Ares.sln --configuration Release --filter "FullyQualifiedName~BackendContractTests|FullyQualifiedName~RedisMultiInstanceTests" --verbosity normal
          python backend/scripts/run_security_benchmark.py

      - name: Upload redacted benchmark & server log artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence-artifacts
          path: |
            evaluation/reports/security_benchmark_report.json
            evaluation/reports/SECURITY_EVALUATION_REPORT.md
            backend/uvicorn_ci.log

  security-supply-chain:
    name: Secret, Dependency & Container Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Secret scanning (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose

      - name: Python dependency vulnerability audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.lock --progress-spinner off

      - name: .NET NuGet vulnerability check
        run: |
          dotnet restore Ares.sln
          dotnet list Ares.sln package --vulnerable --include-transitive | tee /tmp/dotnet_vuln.txt
          if grep -E "Top-level Package|Transitive Package" /tmp/dotnet_vuln.txt; then
            echo "::error title=NuGet Vulnerability::Vulnerable .NET packages detected"
            exit 1
          fi

      - name: Build Docker images
        run: |
          docker build -t ares-api:ci ./backend
          docker build -t ares-web:ci ./src/Ares.Web

      - name: Scan ARES Backend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "ares-api:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Scan ARES Web image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "ares-web:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
