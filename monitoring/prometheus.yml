global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: "ares-security-platform"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ares-fastapi"
    metrics_path: "/metrics"
    scrape_interval: 10s
    authorization:
      type: "Bearer"
      credentials_file: "/tmp/ares_metrics_token"
    static_configs:
      - targets: ["fastapi:8000"]
        labels:
          component: "ares-gateway-api"
